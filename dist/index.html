<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardiology Services</title>
    <script type="module" crossorigin src="/assets/main-BuXlPWYN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-DqJ-dXW1.css">
  </head>
  <body>
    <main>
      <div class="container-center">
        <img
          src="/images/fraser_health_logo.png"
          alt="Fraser Health Logo"
          class="fh-logo"
        />
        <div class="site-header">
          <p class="eyebrow">Burnaby Hospital</p>
          <h1>Diagnostic Cardiology</h1>
        </div>

        <h2 class="service-heading">What brings you in today?</h2>
        <div class="service-grid">
          <button class="card-btn" type="button" data-service="ECG">
            <strong>Electrocardiogram (ECG)</strong>
          </button>
          <button class="card-btn" type="button" data-service="Holter">
            <strong>Holter/Event Monitor</strong>
          </button>
          <button class="card-btn" type="button" data-service="ETT">
            <strong>Exercise/Stress Test</strong>
          </button>
          <button class="card-btn" type="button" data-service="PMC">
            <strong>Pacemaker Clinic</strong>
          </button>
          <button class="card-btn" type="button" data-service="CPC">
            <strong>Chest Pain Clinic</strong>
          </button>
          <button class="card-btn" type="button" data-service="HH">
            <strong>Healthy Heart Program</strong>
          </button>
          <button class="card-btn" type="button" data-service="DRS">
            <strong>Our Doctors</strong>
          </button>
        </div>
      </div>
      <footer class="footer">
        <div>Site created by KF</div>
        <div>Last updated: June 2026</div>
      </footer>
    </main>
  </body>
</html>
